schema: space-widget/v1
id: claim-boundary
name: Claim Boundary
cols: 10
rows: 5
col: 14
row: 0
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;"
    const style = document.createElement("style")
    style.textContent = `.od-claims{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#10131d;border:1px solid rgba(255,184,107,.2);display:grid;gap:12px}.od-claims h3{margin:0;font-size:22px}.od-claims .row{padding:11px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075)}.od-claims b{display:block;color:#ffb86b;margin-bottom:4px}.od-claims span{font-size:12px;color:rgba(255,255,255,.7);line-height:1.35}`
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "od-claims"
    root.innerHTML = `<h3>Safe Claim Boundary</h3><div class="row"><b>Can say</b><span>Prototype exists, workflow is mapped, artifact is reviewable.</span></div><div class="row"><b>Need proof</b><span>Usage, conversion, deployment, customer outcomes.</span></div><div class="row"><b>Next step</b><span>Attach receipt and ask for focused review.</span></div>`
    parent.appendChild(root)
  }
