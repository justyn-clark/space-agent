schema: space-widget/v1
id: board-hero
name: Board Hero
cols: 14
rows: 5
col: 0
row: 0
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;"
    const style = document.createElement("style")
    style.textContent = `.od-hero{height:100%;box-sizing:border-box;border-radius:20px;padding:20px;background:linear-gradient(135deg,#0c1020,#111827 55%,#1b1408);border:1px solid rgba(159,183,255,.24);display:grid;align-content:space-between}.od-hero .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#9fb7ff}.od-hero h2{margin:8px 0 0;font-size:30px;line-height:1.05;letter-spacing:0}.od-hero p{margin:0;color:rgba(255,255,255,.72);font-size:14px;line-height:1.45;max-width:64ch}.od-hero .bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.od-hero .cell{padding:11px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075);font-size:12px;color:rgba(255,255,255,.72)}.od-hero .cell b{display:block;color:#fff;font-size:14px;margin-bottom:4px}`
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "od-hero"
    root.innerHTML = `<div><div class="kicker">Open Design</div><h2>Proof boards for real decisions</h2></div><p>Package the artifact, the claim, the evidence, and the next ask so a client, advisor, or investor can inspect the work quickly.</p><div class="bar"><div class="cell"><b>Audience</b>buyer or stakeholder</div><div class="cell"><b>Artifact</b>interactive HTML board</div><div class="cell"><b>Receipt</b>path, screenshot, URL, validation</div></div>`
    parent.appendChild(root)
  }
