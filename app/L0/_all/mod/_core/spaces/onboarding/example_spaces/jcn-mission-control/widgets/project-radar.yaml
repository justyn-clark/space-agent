schema: space-widget/v1
id: project-radar
name: Project Radar
cols: 10
rows: 7
col: 14
row: 0
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef6ff;"
    const projects = [
      ["SMALL / loopexec", "Spec, runtime, distribution"],
      ["Pai / Boardroom", "Agent operating substrate"],
      ["JustBeatz / Lyrascape", "Music player visuals"],
      ["Open Design", "Proof artifacts"],
      ["Common Thread", "Client proof surfaces"],
      ["Space Agent", "Browser-native canvases"]
    ]
    const style = document.createElement("style")
    style.textContent = `
      .jcn-radar{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#0a1020;border:1px solid rgba(159,183,255,.22);display:grid;grid-template-rows:auto 1fr;gap:14px;overflow:hidden}
      .jcn-radar h3{margin:0;font-size:22px;letter-spacing:0}
      .jcn-radar .list{display:grid;gap:10px;align-content:start;min-height:0;overflow:auto}
      .jcn-radar .row{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;padding:11px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075)}
      .jcn-radar .dot{width:10px;height:10px;border-radius:50%;margin-top:4px;background:#7ee787;box-shadow:0 0 18px rgba(126,231,135,.5)}
      .jcn-radar .name{font-size:14px;font-weight:760;color:#fff}
      .jcn-radar .desc{font-size:12px;color:rgba(238,246,255,.66);margin-top:3px;line-height:1.35}
    `
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "jcn-radar"
    root.innerHTML = `<h3>Project Radar</h3><div class="list">${projects.map(([name, desc]) => `<div class="row"><span class="dot"></span><div><div class="name">${name}</div><div class="desc">${desc}</div></div></div>`).join("")}</div>`
    parent.appendChild(root)
  }
