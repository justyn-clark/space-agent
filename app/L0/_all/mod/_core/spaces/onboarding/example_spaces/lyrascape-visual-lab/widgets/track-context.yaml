schema: space-widget/v1
id: track-context
name: Track Context
cols: 12
rows: 5
col: 0
row: 8
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;"
    const fields = ["track id", "title", "artist", "artwork", "dominant color", "isPlaying", "progress ratio", "duration"]
    const style = document.createElement("style")
    style.textContent = `.lyra-context{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#0b1218;border:1px solid rgba(159,183,255,.2);display:grid;grid-template-rows:auto 1fr;gap:12px}.lyra-context h3{margin:0;font-size:22px}.lyra-context .chips{display:flex;flex-wrap:wrap;gap:8px;align-content:start}.lyra-context .chip{padding:9px 11px;border-radius:999px;background:rgba(159,183,255,.11);border:1px solid rgba(159,183,255,.2);font-size:12px;color:#dfe6ff}`
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "lyra-context"
    root.innerHTML = `<h3>Track Context Contract</h3><div class="chips">${fields.map((field) => `<span class="chip">${field}</span>`).join("")}</div>`
    parent.appendChild(root)
  }
