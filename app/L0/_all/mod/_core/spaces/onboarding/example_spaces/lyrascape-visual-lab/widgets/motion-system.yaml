schema: space-widget/v1
id: motion-system
name: Motion System
cols: 9
rows: 8
col: 15
row: 0
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;"
    const items = [["Pulse", "kick and transport"], ["Drift", "sections and ambience"], ["Trace", "lyrics and motif"], ["Bloom", "chorus / payoff"]]
    const style = document.createElement("style")
    style.textContent = `.lyra-motion{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#111018;border:1px solid rgba(255,184,107,.22);display:grid;grid-template-rows:auto 1fr;gap:14px}.lyra-motion h3{margin:0;font-size:22px}.lyra-motion .item{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:12px;border-radius:15px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075);margin-bottom:10px}.lyra-motion .tag{font-weight:800;color:#ffb86b}.lyra-motion .desc{font-size:12px;color:rgba(255,255,255,.66);line-height:1.35}`
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "lyra-motion"
    root.innerHTML = `<h3>Motion System</h3><div>${items.map(([a,b]) => `<div class="item"><div class="tag">${a}</div><div class="desc">${b}</div></div>`).join("")}</div>`
    parent.appendChild(root)
  }
