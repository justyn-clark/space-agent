schema: space-widget/v1
id: build-queue
name: Build Queue
cols: 12
rows: 5
col: 12
row: 8
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;"
    const queue = ["Canvas runtime slot", "Theme pack per track", "Audio-reactive primitives", "Mobile player parity", "Exportable visual presets"]
    const style = document.createElement("style")
    style.textContent = `.lyra-queue{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#151006;border:1px solid rgba(255,184,107,.24);display:grid;grid-template-rows:auto 1fr;gap:12px}.lyra-queue h3{margin:0;font-size:22px}.lyra-queue ul{margin:0;padding:0;display:grid;gap:8px}.lyra-queue li{list-style:none;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075);font-size:13px;color:rgba(255,255,255,.78)}`
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "lyra-queue"
    root.innerHTML = `<h3>Build Queue</h3><ul>${queue.map((item) => `<li>${item}</li>`).join("")}</ul>`
    parent.appendChild(root)
  }
