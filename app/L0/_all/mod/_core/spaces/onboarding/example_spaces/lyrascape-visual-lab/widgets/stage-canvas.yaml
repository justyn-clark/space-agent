schema: space-widget/v1
id: stage-canvas
name: Stage Canvas
cols: 15
rows: 8
col: 0
row: 0
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;overflow:hidden;border-radius:22px;background:#090b12;"
    const canvas = document.createElement("canvas")
    canvas.style.cssText = "width:100%;height:100%;display:block;background:linear-gradient(135deg,#090b12,#14101a 48%,#132019);"
    parent.appendChild(canvas)
    const ctx = canvas.getContext("2d")
    let frame = 0
    const resize = () => {
      const rect = parent.getBoundingClientRect()
      canvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio))
      canvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio))
    }
    resize()
    const draw = () => {
      frame += 1
      const w = canvas.width
      const h = canvas.height
      ctx.clearRect(0, 0, w, h)
      const g = ctx.createLinearGradient(0, 0, w, h)
      g.addColorStop(0, "#090b12")
      g.addColorStop(.55, "#1b1421")
      g.addColorStop(1, "#102015")
      ctx.fillStyle = g
      ctx.fillRect(0, 0, w, h)
      for (let i = 0; i < 9; i += 1) {
        const x = w * ((i + 1) / 10)
        const amp = Math.sin(frame * .025 + i) * h * .12
        ctx.beginPath()
        ctx.moveTo(x, h * .18)
        ctx.bezierCurveTo(x + amp, h * .36, x - amp, h * .64, x, h * .84)
        ctx.strokeStyle = i % 3 === 0 ? "rgba(255,184,107,.55)" : i % 3 === 1 ? "rgba(126,231,135,.38)" : "rgba(159,183,255,.42)"
        ctx.lineWidth = Math.max(2, w * .004)
        ctx.stroke()
      }
      ctx.fillStyle = "rgba(255,255,255,.92)"
      ctx.font = `${Math.max(24, w * .045)}px Inter, sans-serif`
      ctx.fillText("Lyrascape", w * .07, h * .18)
      ctx.font = `${Math.max(12, w * .018)}px Inter, sans-serif`
      ctx.fillStyle = "rgba(255,255,255,.62)"
      ctx.fillText("audio-reactive song canvas / JustBeatz player layer", w * .07, h * .25)
      requestAnimationFrame(draw)
    }
    requestAnimationFrame(draw)
    new ResizeObserver(resize).observe(parent)
  }
