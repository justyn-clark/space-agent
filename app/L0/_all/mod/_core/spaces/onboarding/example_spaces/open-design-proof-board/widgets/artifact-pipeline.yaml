schema: space-widget/v1
id: artifact-pipeline
name: Artifact Pipeline
cols: 12
rows: 7
col: 0
row: 5
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;"
    const steps = ["Opportunity map", "Artifact brief", "HTML build", "Mobile/desktop QA", "Preview image", "Receipt", "Stakeholder handoff"]
    const style = document.createElement("style")
    style.textContent = `.od-pipe{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#0b1218;border:1px solid rgba(159,183,255,.22);display:grid;grid-template-rows:auto 1fr;gap:12px}.od-pipe h3{margin:0;font-size:22px}.od-pipe .steps{display:grid;gap:8px}.od-pipe .step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075);font-size:13px;color:rgba(255,255,255,.78)}.od-pipe .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#9fb7ff;color:#07101f;font-weight:850}`
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "od-pipe"
    root.innerHTML = `<h3>Artifact Pipeline</h3><div class="steps">${steps.map((step, index) => `<div class="step"><span class="num">${index + 1}</span><span>${step}</span></div>`).join("")}</div>`
    parent.appendChild(root)
  }
