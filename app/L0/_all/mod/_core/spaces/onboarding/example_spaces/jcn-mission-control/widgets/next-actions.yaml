schema: space-widget/v1
id: next-actions
name: Next Actions
cols: 12
rows: 5
col: 12
row: 7
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f7fff8;"
    const actions = ["Open one JCN starter space", "Make one visible improvement", "Capture a receipt", "Commit the fork state", "Extract the reusable pattern"]
    const style = document.createElement("style")
    style.textContent = `
      .jcn-next{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#08130e;border:1px solid rgba(126,231,135,.24);display:grid;grid-template-rows:auto 1fr;gap:12px}
      .jcn-next h3{margin:0;font-size:22px}
      .jcn-next ol{margin:0;padding:0;display:grid;gap:9px;counter-reset:item}
      .jcn-next li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);font-size:13px}
      .jcn-next li::before{counter-increment:item;content:counter(item);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#7ee787;color:#041008;font-weight:800}
    `
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "jcn-next"
    root.innerHTML = `<h3>Next Actions</h3><ol>${actions.map((item) => `<li>${item}</li>`).join("")}</ol>`
    parent.appendChild(root)
  }
