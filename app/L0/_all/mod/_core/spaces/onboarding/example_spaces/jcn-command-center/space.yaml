agent_instructions: |
  This space is a high-leverage operator cockpit for the local JCN project ecosystem.
  Treat every widget as a practical control surface for project awareness, verification, music tooling, creative work, and local operations.

  Keep widgets browser-first and portable.
  Prefer shared current-space scripts for common data, UI primitives, state, Web Audio, MIDI, and command construction.
  Do not add backend access to local project folders unless the user explicitly asks for that server-owned capability.

  When extending this space, favor dense operational surfaces over marketing copy.
  Each widget should answer what matters now, what changed, what command proves it, and what the next useful action is.
