schema: space-widget/v1
id: proof-loop
name: Proof Loop
cols: 12
rows: 5
col: 12
row: 7
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f7fff8;"
    const checks = ["Visible change", "Runtime smoke", "Screenshot or URL", "Receipt note", "Commit boundary"]
    const style = document.createElement("style")
    style.textContent = `
      .jcn-proof-loop{height:100%;box-sizing:border-box;border-radius:20px;padding:18px;background:#07130d;border:1px solid rgba(126,231,135,.24);display:grid;grid-template-rows:auto 1fr;gap:14px}
      .jcn-proof-loop h3{margin:0;font-size:22px}
      .jcn-proof-loop .checks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;align-items:stretch}
      .jcn-proof-loop .check{display:grid;place-items:center;text-align:center;padding:10px;border-radius:14px;background:rgba(126,231,135,.1);border:1px solid rgba(126,231,135,.18);font-size:12px;line-height:1.25;color:#e1ffe7;font-weight:680}
    `
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "jcn-proof-loop"
    root.innerHTML = `<h3>Proof Loop</h3><div class="checks">${checks.map((check) => `<div class="check">${check}</div>`).join("")}</div>`
    parent.appendChild(root)
  }
