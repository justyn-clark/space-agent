agent_instructions: |
  This space is a browser-native audio prototyping lab for JCN.
  Treat it as an experimental but real workspace for building interactive Web Audio tools.

  Favor small, reliable improvements over giant rewrites.
  Preserve shared timing and audio-state scripts when extending the lab.
  When adding widgets, prefer control surfaces, analyzers, synth modules, sequencing tools, and patch-management tools that work together.

  Keep browser audio work practical.
  This space is for Web Audio exploration, rapid iteration, and creative tooling, not for pretending the browser is a full DAW or a native plugin host.
