schema: space-widget/v1
id: model-link
name: Model Link
cols: 12
rows: 5
col: 0
row: 0
renderer: |-
  async (parent) => {
    parent.style.cssText = "all:initial;display:block;width:100%;height:100%;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef9ff;"
    const style = document.createElement("style")
    style.textContent = `
      .jcn-llm-link{height:100%;box-sizing:border-box;border-radius:20px;padding:20px;display:grid;grid-template-rows:auto 1fr;background:linear-gradient(135deg,#06141f 0%,#0b1725 58%,#112011 100%);border:1px solid rgba(103,217,255,.28);box-shadow:0 22px 60px rgba(0,0,0,.26);overflow:hidden}
      .jcn-llm-link header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
      .jcn-llm-link .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#67d9ff;margin-bottom:8px}
      .jcn-llm-link h2{margin:0;font-size:28px;line-height:1;font-weight:800;letter-spacing:0;color:#fff}
      .jcn-llm-link .pill{padding:8px 12px;border-radius:999px;background:rgba(126,231,135,.12);border:1px solid rgba(126,231,135,.22);font-size:12px;color:#d8ffe0;white-space:nowrap}
      .jcn-llm-link .body{align-self:end;display:grid;gap:10px}
      .jcn-llm-link .row{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);font-size:13px;min-width:0}
      .jcn-llm-link .label{color:rgba(238,249,255,.58);text-transform:uppercase;letter-spacing:.12em;font-size:11px}
      .jcn-llm-link .value{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    `
    parent.appendChild(style)
    const root = document.createElement("section")
    root.className = "jcn-llm-link"
    root.innerHTML = `
      <header>
        <div><div class="kicker">Mac Studio Provider</div><h2>Local LLM Studio</h2></div>
        <div class="pill">No cloud API key</div>
      </header>
      <div class="body">
        <div class="row"><div class="label">Endpoint</div><div class="value">100.121.190.62:1234 / v1 chat</div></div>
        <div class="row"><div class="label">Model</div><div class="value">qwen/qwen3.6-27b</div></div>
        <div class="row"><div class="label">Role</div><div class="value">Draft, critique, widget-build, proof loop</div></div>
      </div>
    `
    parent.appendChild(root)
  }
